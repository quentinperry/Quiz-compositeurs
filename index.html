<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizz — Les compositeurs classiques</title>
<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  background: linear-gradient(160deg, #17120e 0%, #2b1f14 55%, #171009 100%);
  min-height: 100vh;
  color: #f5efe6;
}

.quiz-container {
  max-width: 640px;
  margin: 0 auto;
  padding: 2rem 1rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* === Écran d'accueil === */
.welcome-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 1.25rem;
}

.welcome-icon {
  font-size: 5rem;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.welcome-screen h1 {
  font-size: 2.2rem;
  font-weight: 700;
  font-style: italic;
  background: linear-gradient(135deg, #e8c47a, #d4a373, #b8860b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.25;
}

.welcome-screen p {
  color: #c9b8a3;
  font-size: 1.05rem;
  max-width: 430px;
  line-height: 1.6;
}

/* === Boîte de configuration === */
.setup-box {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  text-align: left;
  padding: 1.5rem;
  background: rgba(232, 196, 122, 0.05);
  border: 1px solid rgba(232, 196, 122, 0.18);
  border-radius: 12px;
}

.setup-label {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #d4a373;
  margin-bottom: 0.6rem;
  display: block;
}

.choice-row {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.choice-btn {
  padding: 0.5rem 1rem;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  color: #e6d9c3;
  background: rgba(232, 196, 122, 0.04);
  border: 1.5px solid rgba(232, 196, 122, 0.2);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.18s ease;
}

.choice-btn:hover:not(:disabled) {
  border-color: #d4a373;
  background: rgba(212, 163, 115, 0.1);
  color: #f5efe6;
}

.choice-btn.selected {
  border-color: #d4a373;
  background: rgba(212, 163, 115, 0.18);
  color: #e8c47a;
  box-shadow: 0 0 12px rgba(212, 163, 115, 0.25);
}

.choice-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.start-btn {
  margin-top: 0.5rem;
  padding: 0.9rem 2.5rem;
  font-size: 1.15rem;
  font-weight: 700;
  font-style: italic;
  font-family: inherit;
  color: #17120e;
  background: linear-gradient(135deg, #e8c47a, #d4a373);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 8px 30px rgba(212, 163, 115, 0.35);
}

.start-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(212, 163, 115, 0.5);
}

.start-btn:active {
  transform: translateY(0);
}

/* === Barre de progression === */
.progress-bar-wrap {
  margin-bottom: 1.5rem;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
  color: #c9b8a3;
}

.progress-track {
  height: 6px;
  background: rgba(232, 196, 122, 0.1);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #b8860b, #e8c47a);
  border-radius: 999px;
  transition: width 0.4s ease;
}

/* === Carte question === */
.question-card {
  background: rgba(232, 196, 122, 0.045);
  border: 1px solid rgba(232, 196, 122, 0.15);
  border-radius: 12px;
  padding: 1.75rem;
}

.question-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
}

.q-number {
  font-size: 0.8rem;
  font-weight: 700;
  color: #e8c47a;
  background: rgba(232, 196, 122, 0.12);
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
}

.q-difficulty {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  border: 1px solid;
}

.question-text {
  font-size: 1.35rem;
  font-weight: 700;
  font-style: italic;
  line-height: 1.35;
  margin-bottom: 1.25rem;
  color: #faf6ef;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.85rem 1rem;
  font-size: 1.02rem;
  font-family: inherit;
  font-weight: 500;
  text-align: left;
  color: #e6d9c3;
  background: rgba(232, 196, 122, 0.04);
  border: 1.5px solid rgba(232, 196, 122, 0.18);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.18s ease;
  line-height: 1.4;
}

.option-btn:hover:not(:disabled) {
  border-color: #d4a373;
  background: rgba(212, 163, 115, 0.1);
  color: #f5efe6;
}

.option-btn.selected-correct {
  border-color: #7cb342;
  background: rgba(124, 179, 66, 0.12);
  color: #c5e1a5;
}

.option-btn.selected-wrong {
  border-color: #cd5c5c;
  background: rgba(205, 92, 92, 0.12);
  color: #f1b8b8;
}

.option-btn:disabled {
  cursor: default;
}

.option-letter {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 50%;
  background: rgba(232, 196, 122, 0.08);
  border: 1px solid rgba(232, 196, 122, 0.2);
}

.selected-correct .option-letter {
  background: rgba(124, 179, 66, 0.2);
  border-color: #7cb342;
  color: #c5e1a5;
}

.selected-wrong .option-letter {
  background: rgba(205, 92, 92, 0.2);
  border-color: #cd5c5c;
  color: #f1b8b8;
}

/* === Explication === */
.explanation-box {
  margin-top: 1.25rem;
  padding: 1rem 1.25rem;
  border-radius: 8px;
  background: rgba(212, 163, 115, 0.08);
  border: 1px solid rgba(212, 163, 115, 0.22);
  border-left: 3px solid #d4a373;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.explanation-box .expl-label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #d4a373;
  margin-bottom: 0.4rem;
}

.explanation-box p {
  font-size: 0.98rem;
  line-height: 1.6;
  color: #e6d9c3;
}

.next-btn {
  margin-top: 1.25rem;
  width: 100%;
  padding: 0.85rem;
  font-size: 1.05rem;
  font-weight: 700;
  font-style: italic;
  font-family: inherit;
  color: #17120e;
  background: linear-gradient(135deg, #e8c47a, #d4a373);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.next-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* === Écran de résultat === */
.result-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 1.25rem;
}

.result-emoji {
  font-size: 5rem;
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: scale(0); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.result-screen h2 {
  font-size: 2rem;
  font-weight: 700;
  font-style: italic;
  color: #faf6ef;
}

.score-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 4px solid;
  position: relative;
}

.score-circle .score-num {
  font-size: 2.5rem;
  font-weight: 800;
  line-height: 1;
}

.score-circle .score-denom {
  font-size: 1rem;
  font-weight: 500;
  opacity: 0.7;
}

.result-message {
  color: #c9b8a3;
  font-size: 1.05rem;
  max-width: 420px;
  line-height: 1.6;
}

.result-details {
  display: flex;
  gap: 1.5rem;
  margin-top: 0.5rem;
}

.result-stat {
  text-align: center;
}

.result-stat .stat-num {
  font-size: 1.6rem;
  font-weight: 800;
  color: #faf6ef;
}

.result-stat .stat-label {
  font-size: 0.85rem;
  color: #a08d76;
}

.restart-btn {
  margin-top: 0.75rem;
  padding: 0.85rem 2rem;
  font-size: 1.05rem;
  font-weight: 700;
  font-family: inherit;
  color: #e6d9c3;
  background: rgba(232, 196, 122, 0.06);
  border: 1.5px solid rgba(232, 196, 122, 0.25);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.restart-btn:hover {
  background: rgba(232, 196, 122, 0.12);
  border-color: rgba(232, 196, 122, 0.4);
  color: #faf6ef;
}

/* Responsive */
@media (max-width: 480px) {
  .welcome-screen h1 { font-size: 1.6rem; }
  .question-text { font-size: 1.15rem; }
  .option-btn { font-size: 0.92rem; padding: 0.75rem 0.85rem; }
}

</style>
</head>
<body>
<div id="root"></div>
<script>
const QUESTIONS = [
  // ─── Niveau facile ───
  {
    id: 1,
    question: "Qui a composé la 5e Symphonie, dite « du Destin », avec son célèbre motif à quatre notes ?",
    options: [
      "Joseph Haydn",
      "Ludwig van Beethoven",
      "Johannes Brahms",
      "Anton Bruckner"
    ],
    correctIndex: 1,
    explanation: "Composée entre 1804 et 1808, la 5e Symphonie de Beethoven s'ouvre sur le fameux « ta-ta-ta-taaa », sans doute le motif le plus célèbre de la musique occidentale. Beethoven était alors déjà atteint de surdité.",
    difficulty: "facile"
  },
  {
    id: 2,
    question: "Le Lac des cygnes et Casse-Noisette sont des ballets de… ?",
    options: [
      "Igor Stravinski",
      "Sergueï Prokofiev",
      "Piotr Ilitch Tchaïkovski",
      "Maurice Ravel"
    ],
    correctIndex: 2,
    explanation: "Tchaïkovski a composé trois grands ballets : Le Lac des cygnes (1877), La Belle au bois dormant (1890) et Casse-Noisette (1892), dont est tirée la célèbre « Danse de la fée Dragée ».",
    difficulty: "facile"
  },
  {
    id: 3,
    question: "Qui a composé Les Quatre Saisons ?",
    options: [
      "Antonio Vivaldi",
      "Jean-Sébastien Bach",
      "Georg Friedrich Haendel",
      "Domenico Scarlatti"
    ],
    correctIndex: 0,
    explanation: "Vivaldi a publié Les Quatre Saisons vers 1725 : quatre concertos pour violon (« Le Printemps », « L'Été », « L'Automne », « L'Hiver »), accompagnés de sonnets descriptifs. C'est l'un des chefs-d'œuvre du baroque vénitien.",
    difficulty: "facile"
  },
  {
    id: 4,
    question: "L'opéra Carmen, avec son irrésistible « Habanera », est l'œuvre de… ?",
    options: [
      "Charles Gounod",
      "Jacques Offenbach",
      "Hector Berlioz",
      "Georges Bizet"
    ],
    correctIndex: 3,
    explanation: "Carmen (1875) de Bizet raconte la passion destructrice de Don José pour la cigarière Carmen. L'opéra fut fraîchement accueilli à sa création — Bizet est mort trois mois après, sans connaître son immense succès posthume.",
    difficulty: "facile"
  },
  {
    id: 5,
    question: "Qui a composé la sérénade Une petite musique de nuit (Eine kleine Nachtmusik) ?",
    options: [
      "Wolfgang Amadeus Mozart",
      "Franz Schubert",
      "Joseph Haydn",
      "Carl Maria von Weber"
    ],
    correctIndex: 0,
    explanation: "Mozart a composé cette sérénade pour cordes en 1787 à Vienne. C'est aujourd'hui l'une de ses œuvres les plus jouées et reconnues — le « jingle » du classicisme viennois.",
    difficulty: "facile"
  },
  {
    id: 6,
    question: "Le célèbre « Clair de lune » (Suite bergamasque) a été composé par… ?",
    options: [
      "Gabriel Fauré",
      "Claude Debussy",
      "Maurice Ravel",
      "Erik Satie"
    ],
    correctIndex: 1,
    explanation: "« Clair de lune » est le troisième mouvement de la Suite bergamasque de Debussy, publiée en 1905. Ce morceau pour piano est l'un des plus connus du compositeur français, emblème de l'impressionnisme musical.",
    difficulty: "facile"
  },
  {
    id: 7,
    question: "Le spectaculaire « Vol du bourdon » est un interlude de l'opéra… ?",
    options: [
      "Le Conte du tsar Saltan, de Nikolaï Rimski-Korsakov",
      "Sadko, de Nikolaï Rimski-Korsakov",
      "La Khovantchina, de Modeste Moussorgski",
      "Boris Godounov, de Modeste Moussorgski"
    ],
    correctIndex: 0,
    explanation: "Le « Vol du bourdon » provient du Conte du tsar Saltan (1900) de Rimski-Korsakov : il illustre le vol magique du prince changé en bourdon. Ses gammes chromatiques en fusée en font un défi de virtuosité, surtout au violon.",
    difficulty: "facile"
  },
  {
    id: 8,
    question: "Qui a composé Le Carnaval des animaux, avec son très majestueux « Cygne » ?",
    options: [
      "Camille Saint-Saëns",
      "Hector Berlioz",
      "Emmanuel Chabrier",
      "Léo Delibes"
    ],
    correctIndex: 0,
    explanation: "Saint-Saëns a composé cette fantaisie zoologique en 1886 pour amuser ses amis. Il n'en autorisa la publication intégrale qu'après sa mort, craignant qu'elle nuise à son image de compositeur sérieux — seul « Le Cygne » fut édité de son vivant.",
    difficulty: "facile"
  },
  {
    id: 9,
    question: "Le Boléro, unique mouvement d'orchestre répété en crescendo pendant quinze minutes, est de… ?",
    options: [
      "Emmanuel Chabrier",
      "Maurice Ravel",
      "Claude Debussy",
      "Igor Stravinski"
    ],
    correctIndex: 1,
    explanation: "Commandé comme ballet par Ida Rubinstein, le Boléro (1928) de Ravel repose sur deux mélodies répétées sur un ostinato de tambour, avec une orchestration qui s'amplifie jusqu'au tumulte final. Un tour de force d'orchestration.",
    difficulty: "facile"
  },
  {
    id: 10,
    question: "La « Chevauchée des Walkyries » est extraite de… ?",
    options: [
      "Lohengrin, de Richard Wagner",
      "Tristan et Isolde, de Richard Wagner",
      "L'Anneau du Nibelung, de Richard Wagner",
      "Parsifal, de Richard Wagner"
    ],
    correctIndex: 2,
    explanation: "La « Walkürenritt » ouvre le troisième acte de La Walkyrie, deuxième journée de la tétralogie L'Anneau du Nibelung de Wagner. Les Walkyries sont des vierges guerrières qui emportent les héros morts au Valhalla.",
    difficulty: "facile"
  },
  {
    id: 11,
    question: "Frédéric Chopin, surnommé « le poète du piano », reste indissociable de quel instrument ?",
    options: [
      "le violon",
      "le piano",
      "le violoncelle",
      "l'orgue"
    ],
    correctIndex: 1,
    explanation: "Presque toute l'œuvre de Chopin est dédiée au piano : nocturnes, ballades, études, mazurkas et polonaises. Né près de Varsovie, il s'installe à Paris en 1831 et devient la figure centrale du romantisme pianistique.",
    difficulty: "facile"
  },
  {
    id: 12,
    question: "Frédéric Chopin était de quelle nationalité ?",
    options: [
      "Française",
      "Russe",
      "Polonaise",
      "Allemande"
    ],
    correctIndex: 2,
    explanation: "Né à Żelazowa Wola près de Varsovie en 1810, d'un père français et d'une mère polonaise, Chopin est revendiqué comme le grand compositeur national de la Pologne — ses mazurkas et polonaises portent la voix du pays alors partagé entre empires.",
    difficulty: "facile"
  },
  {
    id: 13,
    question: "Qui a composé la musique de scène Peer Gynt, avec « Dans la grotte du roi de la montagne » ?",
    options: [
      "Edvard Grieg",
      "Jean Sibelius",
      "Carl Nielsen",
      "Niels Gade"
    ],
    correctIndex: 0,
    explanation: "Grieg, le plus grand compositeur norvégien, a écrit en 1875 cette musique pour le drame d'Henrik Ibsen. « Dans la grotte du roi de la montagne » et « Matin » sont devenues deux tubes universels du répertoire.",
    difficulty: "facile"
  },
  {
    id: 14,
    question: "La Traviata et Aïda sont des opéras de… ?",
    options: [
      "Giacomo Puccini",
      "Gioachino Rossini",
      "Gaetano Donizetti",
      "Giuseppe Verdi"
    ],
    correctIndex: 3,
    explanation: "Verdi a dominé l'opéra italien du XIXe siècle avec Rigoletto, La Traviata, Aïda, Otello, Falstaff… Ses mélodies et son sens du théâtre ont fait de lui le compositeur le plus joué des opéras italiens aux côtés de Puccini.",
    difficulty: "facile"
  },

  // ─── Niveau moyen ───
  {
    id: 15,
    question: "Qui a composé la Symphonie fantastique, récit orchestral d'une passion obsessionnelle ?",
    options: [
      "Camille Saint-Saëns",
      "Hector Berlioz",
      "César Franck",
      "Georges Bizet"
    ],
    correctIndex: 1,
    explanation: "Berlioz a composé cette symphonie-programme en 1830, inspirée par son amour (non partagé) pour l'actrice Harriet Smithson. Elle utilise l'« idée fixe », motif récurrent qui symbolise l'être aimé — une innovation majeure de la musique romantique.",
    difficulty: "moyen"
  },
  {
    id: 16,
    question: "Quel compositeur, mort à 31 ans, a laissé plus de 600 lied (chants) pour voix et piano ?",
    options: [
      "Robert Schumann",
      "Felix Mendelssohn",
      "Franz Schubert",
      "Hugo Wolf"
    ],
    correctIndex: 2,
    explanation: "Schubert est le maître incontesté du lied : plus de 600 mélodies, dont le cycle La Belle Meunière et le quintette « La Truite ». « Der Erlkönig » (Le Roi des aulnes), écrit à 18 ans, reste un sommet du genre.",
    difficulty: "moyen"
  },
  {
    id: 17,
    question: "Qui a composé la Symphonie « du Nouveau Monde », n°9, très influencée par les mélodies américaines et tchèques ?",
    options: [
      "Antonín Dvořák",
      "Bedřich Smetana",
      "Leoš Janáček",
      "Béla Bartók"
    ],
    correctIndex: 0,
    explanation: "Dvořák a composé cette symphonie en 1893, alors directeur du Conservatoire de New York. Il y intègre des sonorités inspirées des chants spirituels afro-américains et amérindiens, avec une profonde nostalgie de sa Bohême natale.",
    difficulty: "moyen"
  },
  {
    id: 18,
    question: "Qui a composé les Gymnopédies, pièces lentes et suspendues pour piano ?",
    options: [
      "Erik Satie",
      "Claude Debussy",
      "Maurice Ravel",
      "Francis Poulenc"
    ],
    correctIndex: 0,
    explanation: "Erik Satie a composé les trois Gymnopédies en 1888. Lents, dépouillés, presque hypnotiques, ces morceaux préfigurent l'ambiance de la future « musique d'ameublement » de Satie et inspireront Debussy, qui les orchestra.",
    difficulty: "moyen"
  },
  {
    id: 19,
    question: "Qui a composé les opéras Tosca, La Bohème et Madame Butterfly ?",
    options: [
      "Giuseppe Verdi",
      "Giacomo Puccini",
      "Vincenzo Bellini",
      "Pietro Mascagni"
    ],
    correctIndex: 1,
    explanation: "Puccini (1858-1924) est le dernier grand maître de l'opéra italien. Ses héroïnes tragiques (Tosca, Mimì, Cio-Cio-San) et son art de la mélodie au service du drame font de lui l'un des compositeurs d'opéra les plus joués au monde.",
    difficulty: "moyen"
  },
  {
    id: 20,
    question: "Qui a composé la Symphonie n°94, dite « Surprise », et mérite le surnom de « père de la symphonie » ?",
    options: [
      "Wolfgang Amadeus Mozart",
      "Ludwig van Beethoven",
      "Joseph Haydn",
      "Johann Stamitz"
    ],
    correctIndex: 2,
    explanation: "Haydn a composé plus de 100 symphonies, fixant la forme pour ceux qui viendront. La « Surprise » (1791) doit son nom au coup de timbales inattendu dans le mouvement lent, destiné à réveiller un public assoupi — Haydn avait le sens de l'humour.",
    difficulty: "moyen"
  },
  {
    id: 21,
    question: "Qui a composé Le Clavier bien tempéré, recueil de 48 préludes et fugues ?",
    options: [
      "Georg Friedrich Haendel",
      "Domenico Scarlatti",
      "Jean-Sébastien Bach",
      "Carl Philipp Emanuel Bach"
    ],

const LETTERS = ["A", "B", "C", "D"];

function availableQuestions() {
  return selectedDifficulty === "tous"
    ? QUESTIONS
    : QUESTIONS.filter(q => q.difficulty === selectedDifficulty);
}

function getResultData(score, total) {
  const pct = (score / total) * 100;
  if (pct === 100) return { emoji: "🏆", title: "Maestro !", message: "Bravissimo — vous connaissez le répertoire sur le bout des doigts, du baroque au XXe siècle.", color: "#e8c47a" };
  if (pct >= 80) return { emoji: "🎻", title: "Virtuose !", message: "Une culture musicale impressionnante. Quelques mesures à retravailler pour le concert parfait.", color: "#d4a373" };
  if (pct >= 60) return { emoji: "🎼", title: "Bon concert !", message: "Vous maîtrisez les grandes œuvres. Le récital continue — retournez quelques partitions.", color: "#7cb342" };
  if (pct >= 40) return { emoji: "🎹", title: "En rodage…", message: "Les bases sont là, mais l'orchestre a besoin de répétitions. Relancez le quizz !", color: "#cd5c5c" };
  return { emoji: "🤔", title: "Fausse note !", message: "L'histoire des compositeurs réserve bien des surprises. Une deuxième écoute s'impose.", color: "#cd5c5c" };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Mélange les options d'une question et recalcule l'index de la bonne réponse.
// Sauf si l'ordre des propositions est logique (ex : ordre chronologique),
// auquel cas on conserve l'ordre d'origine (flag keepOptionsOrder).
function prepareQuestion(q) {
  if (q.keepOptionsOrder) return { ...q };
  const correctText = q.options[q.correctIndex];
  const options = shuffle(q.options);
  return { ...q, options, correctIndex: options.indexOf(correctText) };
}

function startQuiz() {
  const pool = shuffle(availableQuestions()).map(prepareQuestion);
  shuffledQuestions = (selectedCount > 0) ? pool.slice(0, selectedCount) : pool;
  if (shuffledQuestions.length === 0) return;
  phase = "playing";
  currentIndex = 0;
  selectedOption = null;
  showExplanation = false;
  score = 0;
  render();
}

function handleSelectDifficulty(value) {
  selectedDifficulty = value;
  const avail = availableQuestions().length;
  if (selectedCount > avail) selectedCount = 0;
  render();
}

function handleSelectCount(value) {
  selectedCount = value;
  render();
}

function handleSelectOption(idx) {
  if (selectedOption !== null) return;
  selectedOption = idx;
  const q = shuffledQuestions[currentIndex];
  if (idx === q.correctIndex) score++;
  showExplanation = true;
  render();
}

function handleNext() {
  if (currentIndex + 1 >= shuffledQuestions.length) {
    phase = "result";
  } else {
    currentIndex++;
    selectedOption = null;
    showExplanation = false;
  }
  render();
}

function restart() {
  phase = "welcome";
  render();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function render() {
  const root = document.getElementById("root");
  
  if (phase === "welcome") {
    const avail = availableQuestions().length;
    const finalCount = (selectedCount > 0) ? Math.min(selectedCount, avail) : avail;
    
    const diffBtns = DIFF_CHOICES.map(d => {
      const sel = selectedDifficulty === d.value ? "selected" : "";
      const n = d.value === "tous" ? QUESTIONS.length : QUESTIONS.filter(q => q.difficulty === d.value).length;
      return `<button class="choice-btn ${sel}" data-diff="${d.value}">${d.label} <small style="opacity:0.6">(${n})</small></button>`;
    }).join("");
    
    const countBtns = COUNT_CHOICES.map(n => {
      const value = n;
      const label = n === 0 ? `Toutes (${avail})` : String(n);
      const disabled = n > avail ? "disabled" : "";
      const sel = selectedCount === value ? "selected" : "";
      return `<button class="choice-btn ${sel}" data-count="${value}" ${disabled}>${label}</button>`;
    }).join("");
    
    root.innerHTML = `
      <div class="quiz-container">
        <div class="welcome-screen">
          <div class="welcome-icon">🎼</div>
          <h1>Quizz — Les compositeurs<br>de musique classique</h1>
          <p>De Bach à Messiaen, de Vivaldi à Gershwin : testez vos connaissances sur les grands compositeurs et leurs œuvres, du baroque au XXe siècle.</p>
          <div class="setup-box">
            <div class="setup-section">
              <span class="setup-label">🎵 Niveau</span>
              <div class="choice-row">${diffBtns}</div>
            </div>
            <div class="setup-section">
              <span class="setup-label">🔢 Nombre de questions</span>
              <div class="choice-row">${countBtns}</div>
            </div>
          </div>
          <p style="font-size:0.9rem;color:#a08d76">${finalCount} question${finalCount > 1 ? "s" : ""} · ~${Math.max(1, Math.ceil(finalCount * 0.35))} minute${finalCount * 0.35 > 1 ? "s" : ""}</p>
          <button class="start-btn" id="start-btn">▶ Lever le rideau</button>
        </div>
      </div>`;
    
    document.querySelectorAll(".choice-btn[data-diff]").forEach(btn => {
      btn.addEventListener("click", () => handleSelectDifficulty(btn.dataset.diff));
    });
    document.querySelectorAll(".choice-btn[data-count]").forEach(btn => {
      btn.addEventListener("click", () => handleSelectCount(parseInt(btn.dataset.count)));
    });
    document.getElementById("start-btn").addEventListener("click", startQuiz);
    return;
  }
  
  if (phase === "result") {
    const total = shuffledQuestions.length;
    const result = getResultData(score, total);
    const wrongCount = total - score;
    root.innerHTML = `
      <div class="quiz-container">
        <div class="result-screen">
          <div class="result-emoji">${result.emoji}</div>
          <h2>${result.title}</h2>
          <div class="score-circle" style="border-color:${result.color};box-shadow:0 0 40px ${result.color}33">
            <span class="score-num" style="color:${result.color}">${score}</span>
            <span class="score-denom" style="color:${result.color}">/ ${total}</span>
          </div>
          <p class="result-message">${result.message}</p>
          <div class="result-details">
            <div class="result-stat"><div class="stat-num" style="color:#7cb342">${score}</div><div class="stat-label">Justes</div></div>
            <div class="result-stat"><div class="stat-num" style="color:#cd5c5c">${wrongCount}</div><div class="stat-label">Fausses</div></div>
            <div class="result-stat"><div class="stat-num" style="color:#e8c47a">${Math.round((score/total)*100)}%</div><div class="stat-label">Score</div></div>
          </div>
          <button class="restart-btn" id="restart-btn">🔄 Rejouer</button>
        </div>
      </div>`;
    document.getElementById("restart-btn").addEventListener("click", restart);
    return;
  }
  
  // Playing phase
  const q = shuffledQuestions[currentIndex];
  const total = shuffledQuestions.length;
  const progress = ((currentIndex + (showExplanation ? 1 : 0)) / total) * 100;
  const diff = DIFFICULTY_LABELS[q.difficulty];
  
  let optionsHtml = q.options.map((opt, idx) => {
    let cls = "option-btn";
    if (selectedOption !== null) {
      if (idx === q.correctIndex) cls += " selected-correct";
      else if (idx === selectedOption) cls += " selected-wrong";
    }
    return `<button class="${cls}" data-idx="${idx}" ${selectedOption !== null ? "disabled" : ""}>
      <span class="option-letter">${LETTERS[idx]}</span>${esc(opt)}
    </button>`;
  }).join("");
  
  let explanationHtml = "";
  if (showExplanation) {
    explanationHtml = `<div class="explanation-box"><div class="expl-label">💡 Le saviez-vous ?</div><p>${esc(q.explanation)}</p></div>`;
  }
  
  let nextHtml = "";
  if (showExplanation) {
    nextHtml = `<button class="next-btn" id="next-btn">${currentIndex + 1 >= total ? "Voir les résultats →" : "Question suivante →"}</button>`;
  }
  
  root.innerHTML = `
    <div class="quiz-container">
      <div class="progress-bar-wrap">
        <div class="progress-info">
          <span>Question ${currentIndex + 1} / ${total}</span>
          <span>Score : ${score}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div>
      <div class="question-card">
        <div class="question-header">
          <span class="q-number">Q${currentIndex + 1}</span>
          <span class="q-difficulty" style="color:${diff.color};border-color:${diff.color}55;background:${diff.color}14">${diff.icon} ${diff.label}</span>
        </div>
        <p class="question-text">${esc(q.question)}</p>
        <div class="options-list">${optionsHtml}</div>
        ${explanationHtml}
        ${nextHtml}
      </div>
    </div>`;
  
  // Wire up option buttons
  if (selectedOption === null) {
    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => handleSelectOption(parseInt(btn.dataset.idx)));
    });
  }
  
  if (showExplanation) {
    document.getElementById("next-btn").addEventListener("click", handleNext);
  }
}

// Initial render
render();

</script>
</body>
</html>
